<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        font-family: Inter, system-ui, sans-serif;
        background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 45%, #ecfdf5 100%);
        position: relative;
      }
      .blob { position: absolute; border-radius: 9999px; filter: blur(80px); }
      .b1 { width: 460px; height: 460px; background: rgba(34,197,94,.28); top: -160px; right: -120px; }
      .b2 { width: 420px; height: 420px; background: rgba(16,185,129,.22); bottom: -180px; left: -120px; }
      .wrap { position: relative; display: flex; height: 100%; align-items: center; padding: 0 72px; gap: 56px; }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
      .mark {
        width: 56px; height: 56px; border-radius: 16px; background: #16a34a;
        display: flex; align-items: center; justify-content: center; font-size: 30px;
      }
      .name { font-size: 34px; font-weight: 800; color: #0f172a; letter-spacing: -.02em; }
      .badge {
        display: inline-block; padding: 10px 20px; border-radius: 9999px;
        background: #dcfce7; color: #15803d; font-size: 19px; font-weight: 600; margin-bottom: 24px;
      }
      h1 { font-size: 72px; line-height: 1.04; font-weight: 900; color: #0f172a; letter-spacing: -.035em; }
      h1 em { font-style: normal; color: #16a34a; }
      p { margin-top: 24px; font-size: 25px; line-height: 1.45; color: #475569; max-width: 620px; }
      .cta {
        margin-top: 34px; display: inline-block; padding: 17px 38px; border-radius: 9999px;
        background: #16a34a; color: #fff; font-size: 23px; font-weight: 700;
      }
      .art {
        width: 310px; height: 310px; border-radius: 68px; flex-shrink: 0;
        background: linear-gradient(135deg, #22c55e, #059669);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 30px 60px -20px rgba(5,150,105,.55);
      }
      .art span { font-size: 150px; }
    </style>
  </head>
  <body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="wrap">
      <div>
        <div class="brand">
          <div class="mark">🌿</div>
          <div class="name">CleanPay</div>
        </div>
        <div class="badge">Bengaluru Pilot — Demand Survey</div>
        <h1>Turn <em>Garbage</em><br />into <em>Value</em></h1>
        <p>Doorstep waste pickup that pays you back for recyclables. We're testing demand — register your interest.</p>
        <div class="cta">Register Interest →</div>
      </div>
      <div class="art"><span>♻️</span></div>
    </div>
  </body>
</html>
